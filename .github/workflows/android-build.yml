  reproducible-build:
    name: Reproducible release build ${{ matrix.replica }}
    runs-on: ubuntu-24.04
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]

    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Set up pinned JDK
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95   # v5
      with:
        distribution: temurin
        java-version: ${{ env.SETUP_JAVA_VERSION }}

    - name: Set up and validate Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92   # v6.2.0
      with:
        cache-disabled: true

    - name: Build canonical unsigned release
      run: tools/reproducible-builds/build-in-container.sh "$RUNNER_TEMP/release-${{ matrix.replica }}"

    - name: Upload build replica
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
      with:
        name: reproducible-release-${{ matrix.replica }}
        path: ${{ runner.temp }}/release-${{ matrix.replica }}/*
        if-no-files-found: error

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
