            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  compare-reproducible-builds:
    name: Compare release bytes
    runs-on: ubuntu-24.04
    needs: reproducible-build

    steps:
    - name: Checkout verification script
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Download replica A
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
      with:
        name: reproducible-release-a
        path: ${{ runner.temp }}/release-a

    - name: Download replica B
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
      with:
        name: reproducible-release-b
        path: ${{ runner.temp }}/release-b

    - name: Compare every canonical byte
      run: tools/reproducible-builds/compare-release.sh "$RUNNER_TEMP/release-a" "$RUNNER_TEMP/release-b"
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
